services:
  db:
    image: postgres:18-alpine
    container_name: haupcar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: haupcar
      POSTGRES_PASSWORD: haupcar
      POSTGRES_DB: haupcar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
